# ─────────────────────────────────────────────────────────────────────────────
# Scanner Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Both scanners pass ALL content to Claude Code for judgment.
# No keyword scoring — Claude decides what's valuable based on the
# preferences embedded in each scanner's output.

# ── HN Settings ──────────────────────────────────────────────────────────────

feeds:
  - topstories
  - beststories

max_stories: 150       # how many raw stories to fetch from HN
max_age_hours: 48      # ignore stories older than this

# ── Twitter Settings ─────────────────────────────────────────────────────────

